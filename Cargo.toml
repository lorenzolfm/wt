[package]
name = "wt"
version = "0.1.0"
edition = "2024"
description = "Git worktree manager with shared gitignored files"
license = "MIT"
repository = "https://github.com/lorenzolfm/wt"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.release]
strip = true

[dev-dependencies]
tempfile = "3.27.0"
